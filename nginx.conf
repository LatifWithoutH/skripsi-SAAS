# 1. Redirect HTTP ke HTTPS
server {
    listen 80;
    server_name localhost saas.local *.saas.local;
    return 301 https://$host$request_uri;
}

# 2. Server HTTPS Utama
server {
    listen 443 ssl;
    server_name localhost saas.local *.saas.local;

    # Sertifikat Wildcard mkcert (Nama file disesuaikan dengan output mkcert Anda)
    ssl_certificate /etc/nginx/certs/wildcard.pem;
    ssl_certificate_key /etc/nginx/certs/wildcard-key.pem;

    # ✅ PILIHAN ANDA: Serve File Statis Langsung via Nginx (Sangat Cepat)
    location /css/ {
        alias /usr/share/nginx/html/public/css/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /js/ {
        alias /usr/share/nginx/html/public/js/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        alias /usr/share/nginx/html/public/images/;
        expires 30d;
    }

    # ✅ Proxy Request Dinamis (HTML, API, Login) ke Node.js
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # Penting agar Node.js tahu ini HTTPS
    }
}