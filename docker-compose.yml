# Hapus baris "version: '3.8'" agar warning hilang (standar Docker Compose V2)

services:
  # 1. Lapisan Database (PostgreSQL)
  db:
    image: postgres:14-alpine
    container_name: saas_db
    environment:
      POSTGRES_USER: skripsi_user
      POSTGRES_PASSWORD: rahasia_kuat_123
      POSTGRES_DB: saas_skripsi_db
      TZ: Asia/Jakarta
    volumes:
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data  # ✅ Persisten data database
    networks:
      - internal_network
    # ✅ TAMBAHAN PENTING: Healthcheck agar Node.js menunggu DB benar-benar siap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skripsi_user -d saas_skripsi_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped  # ✅ Auto-restart kalau crash/laptop reboot

  # 2. Lapisan Aplikasi (Node.js)
  app:
    build: .
    ports:
      - "3000:3000"
    container_name: saas_app
    # ✅ TAMBAHAN PENTING: Baca otomatis dari file .env Anda (lebih rapi & anti typo)
    env_file:
      - .env
    # ✅ TAMBAHAN PENTING: Tunggu healthcheck DB berhasil sebelum start
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_network
    # ✅ BIND MOUNT: Sync folder host → container (untuk development)
    volumes:
      - .:/app                    # Sync seluruh folder proyek ke container
      - /app/node_modules         # Kecuali node_modules (pakai yang di container)
      - /app/public/uploads       # Kecuali uploads (biar persisten)
    # ✅ Healthcheck untuk monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped  # ✅ Auto-restart kalau crash/laptop reboot

  # 3. Lapisan Jaringan / Reverse Proxy (Nginx)
  proxy:
    image: nginx:alpine
    container_name: saas_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - internal_network
    restart: unless-stopped  # ✅ Auto-restart kalau crash/laptop reboot

# ✅ Definisi Jaringan Virtual Terisolasi
networks:
  internal_network:
    driver: bridge

# ✅ Definisi Volume Persisten
volumes:
  postgres_data:  # ✅ Data database tidak hilang saat container di-recreate